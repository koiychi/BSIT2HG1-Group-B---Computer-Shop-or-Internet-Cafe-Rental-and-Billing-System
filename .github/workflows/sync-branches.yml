name: Sync Branches from Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync branches with main
        run: |
          for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | grep -v -E '^(main|HEAD)$'); do
            echo "--- Syncing branch: $branch ---"
            git checkout $branch
            if git merge origin/main -m "chore: auto-sync with main [skip ci]"; then
              git push origin $branch
              echo "Successful sync: $branch"
            else
              echo "Merge conflict on $branch. Cancelling merge."
              git merge --abort
            fi
          done
